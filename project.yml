# XcodeGen 配置。修改后运行 `make bootstrap`，不要手动编辑 .xcodeproj。
name: MAIO
options:
  bundleIdPrefix: app.maio
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  MAIO:
    path: Packages/MAIO
# 版本号：主程序和 Finder 扩展共用（扩展版本必须和主程序一致）
settings:
  base:
    MARKETING_VERSION: "0.2.5"
    CURRENT_PROJECT_VERSION: "10"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  MAIO:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["*.entitlements", "AppIcon.icon"]
      # Icon Composer 图标（macOS 26 自动加液态玻璃效果），源文件是 App/AppIcon.icon/Assets 下的 SVG
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: MAIO
        product: MAIOApp
      # Finder 右键菜单扩展，打包到 Contents/PlugIns
      - target: MAIOFinderSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.maio.MAIO
        PRODUCT_NAME: MAIO
        SWIFT_VERSION: "6.0"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/MAIO.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: MAIO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_FILE: App/Info.plist
  # Finder 右键菜单（Finder Sync 扩展，必须开沙盒）。只负责显示菜单，动作交给主程序（maio:// URL）
  MAIOFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderSync
        excludes: ["*.entitlements", "Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.maio.MAIO.FinderSync
        PRODUCT_NAME: MAIOFinderSync
        SWIFT_VERSION: "6.0"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: FinderSync/FinderSync.entitlements
        INFOPLIST_FILE: FinderSync/Info.plist
        GENERATE_INFOPLIST_FILE: YES
