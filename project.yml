# XcodeGen 配置。修改后运行 `make bootstrap`，不要手动编辑 .xcodeproj。
name: MAIO
options:
  bundleIdPrefix: app.maio
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  MAIO:
    path: Packages/MAIO
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  MAIO:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["*.entitlements", "AppIcon.icon"]
      # Icon Composer 图标（macOS 26 自动加液态玻璃效果），源文件是 App/AppIcon.icon/Assets 下的 SVG
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: MAIO
        product: MAIOApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.maio.MAIO
        PRODUCT_NAME: MAIO
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/MAIO.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: MAIO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_FILE: App/Info.plist
